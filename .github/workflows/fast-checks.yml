name: Fast package checks

on:
  pull_request:
  push:
  workflow_dispatch:
  # ctsem's development branch moves without anything being pushed here, so a
  # change there that breaks the GUI would otherwise wait for the next push.
  schedule:
    - cron: '41 4 * * *'

concurrency:
  group: fast-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: any::roxygen2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check generated documentation is current
        shell: bash
        run: |
          # Says what differs rather than exiting 1 and leaving the reader to
          # reproduce it. The log of a failed run needs write access to read;
          # an ::error:: annotation does not, so the reason belongs in one.
          set +e
          Rscript -e 'roxygen2::roxygenise(".")' > "$RUNNER_TEMP/roxygen.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/roxygen.log"
          if [ $status -ne 0 ]; then
            echo "::error::roxygenise() failed: $(tail -c 700 "$RUNNER_TEMP/roxygen.log" | paste -sd' ' -)"
            exit 1
          fi
          # status, not diff: a generated file that is new rather than changed
          # is just as stale, and diff alone does not see it.
          changed=$(git status --porcelain -- NAMESPACE man)
          if [ -n "$changed" ]; then
            version=$(Rscript -e 'cat(as.character(packageVersion("roxygen2")))')
            echo "::error::NAMESPACE or man/ is not what roxygen2 $version generates; regenerate and commit. Differs: $(echo "$changed" | paste -sd' ' -)"
            git diff --stat -- NAMESPACE man
            git diff -- NAMESPACE man | head -120
            exit 1
          fi
      - name: Check dependency and asset hygiene
        run: Rscript tools/check-package-hygiene.R
      - name: Check JavaScript syntax
        run: find inst -name '*.js' -print0 | xargs -0 -n1 node --check

  # The GUI has to work with the ctsem users install from CRAN and with the
  # development branch that will become the next release, and the two differ
  # in what they accept: the GUI asks the installed ctsem rather than assuming.
  tests:
    name: tests (ctsem ${{ matrix.ctsem }})
    runs-on: ubuntu-latest
    # The juliaFit leg builds ctsem's Stan models from source when its commit
    # is new. A run past this has hung rather than run long.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        ctsem: [cran, juliaFit]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      MAKEFLAGS: -j4
      # Consent to ctsem installing the engine's Julia dependencies from a
      # script. Julia itself comes from setup-julia below.
      CTSEM_JULIA_AGREE: 'yes'
      # The workload replays whole fits to build a faster image, which costs
      # most of the precompile time and is paid again on every engine change.
      # The tests need the engine to load, not to be fast.
      CTSEM_PRECOMPILE_WORKLOAD: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2

      # Only the juliaFit leg: CRAN's ctsem has no Julia backend.
      - uses: julia-actions/setup-julia@v3
        if: matrix.ctsem == 'juliaFit'
        with:
          # ctsem's pin, in R/ctJuliaInstall.R and its own CI.
          version: '1.12.7'
      # The depot: registries, packages and compiled images, the engine's
      # among them, so an unchanged engine is not precompiled again.
      - uses: julia-actions/cache@v3
        if: matrix.ctsem == 'juliaFit'

      # Pinned to one commit for the whole run, so the compiler cache key, the
      # install and the version check below all mean the same ctsem even if
      # the branch moves mid-run.
      - name: Resolve the ctsem under test
        id: ctsem
        shell: bash
        run: |
          if [ "${{ matrix.ctsem }}" = juliaFit ]; then
            sha=$(git ls-remote https://github.com/cdriveraus/ctsem.git refs/heads/juliaFit | cut -f1)
            if [ -z "$sha" ]; then
              echo "::error::Could not resolve cdriveraus/ctsem@juliaFit"
              exit 1
            fi
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "ref=github::cdriveraus/ctsem@$sha any::JuliaConnectoR" >> "$GITHUB_OUTPUT"
          else
            echo "ref=any::ctsem" >> "$GITHUB_OUTPUT"
          fi

      # ctsem's three Stan models are nearly all of its build time. ccache keys
      # on the preprocessed source, so a juliaFit commit that touches only R
      # recompiles nothing.
      # ctsem copies the engine into a project directory named by its
      # content hash and resolves it there; the compiled image in the depot
      # belongs to that copy.
      - name: Engine project cache
        if: matrix.ctsem == 'juliaFit'
        uses: actions/cache@v5
        with:
          path: ~/.cache/R/ctsem/julia
          key: ctsem-engine-${{ steps.ctsem.outputs.sha }}
          restore-keys: |
            ctsem-engine-

      - name: Compiler cache
        if: matrix.ctsem == 'juliaFit'
        uses: actions/cache@v5
        with:
          path: ~/.ccache
          key: ccache-ctsem-${{ steps.ctsem.outputs.sha }}
          restore-keys: |
            ccache-ctsem-
      - name: Point R at ccache
        if: matrix.ctsem == 'juliaFit'
        shell: bash
        run: |
          command -v ccache >/dev/null || sudo apt-get install -y ccache
          mkdir -p ~/.R ~/.ccache
          {
            echo 'CC = ccache gcc'
            echo 'CXX = ccache g++'
            echo 'CXX11 = ccache g++'
            echo 'CXX14 = ccache g++'
            echo 'CXX17 = ccache g++'
            echo 'CXX20 = ccache g++'
          } >> ~/.R/Makevars
          printf 'max_size = 2.0G\nsloppiness = include_file_ctime,include_file_mtime,time_macros\n' > ~/.ccache/ccache.conf
          ccache -z

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          extra-packages: ${{ steps.ctsem.outputs.ref }}
          # Separate caches, or one leg restores the other's ctsem and pak
          # then replaces it on every run.
          cache-version: ctsem-${{ matrix.ctsem }}

      - name: Compiler cache statistics
        if: always() && matrix.ctsem == 'juliaFit'
        run: ccache -s

      # A leg that silently installed the other ctsem would pass while testing
      # nothing new, so the version is checked rather than assumed.
      - name: Confirm which ctsem is under test
        shell: Rscript {0}
        env:
          CTSEM_LEG: ${{ matrix.ctsem }}
          CTSEM_SHA: ${{ steps.ctsem.outputs.sha }}
        run: |
          d <- utils::packageDescription("ctsem")
          leg <- Sys.getenv("CTSEM_LEG")
          if (identical(leg, "juliaFit")) {
            want <- Sys.getenv("CTSEM_SHA")
            ok <- identical(d$RemoteSha, want)
            label <- sprintf("ctsem %s at cdriveraus/ctsem@%s (juliaFit)", d$Version, substr(want, 1, 8))
            if (!ok) msg <- sprintf("expected cdriveraus/ctsem@%s, found ctsem %s with RemoteSha %s",
              want, d$Version, if (is.null(d$RemoteSha)) "none" else d$RemoteSha)
          } else {
            cran <- utils::available.packages(repos = "https://cloud.r-project.org")["ctsem", "Version"]
            ok <- identical(d$Version, unname(cran)) && is.null(d$RemoteSha)
            label <- sprintf("ctsem %s from CRAN", d$Version)
            if (!ok) msg <- sprintf("expected CRAN's ctsem %s, found %s%s", cran, d$Version,
              if (is.null(d$RemoteSha)) "" else paste0(" from ", d$RemoteSha))
          }
          if (!ok) {
            cat(sprintf("::error title=Wrong ctsem (%s leg)::%s\n", leg, msg))
            quit(status = 1)
          }
          cat(sprintf("::notice title=ctsem under test::%s\n", label))

      - name: Julia engine loads and fits
        if: matrix.ctsem == 'juliaFit'
        timeout-minutes: 45
        run: Rscript tools/julia-smoke.R

      - name: Run tests
        shell: bash
        timeout-minutes: 40
        run: |
          set +e
          Rscript tools/run-tests.R > "$RUNNER_TEMP/tests.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/tests.log"
          if [ $status -ne 0 ]; then
            # The failure list goes in the annotation: a run's log is not
            # readable without signing in, its annotations are.
            failed=$(grep -E '^── [0-9]+\. (Failure|Error)' "$RUNNER_TEMP/tests.log" | head -12 | paste -sd'|' -)
            if [ -z "$failed" ]; then
              failed=$(tail -c 700 "$RUNNER_TEMP/tests.log" | paste -sd' ' -)
            fi
            echo "::error title=Tests failed against ctsem ${{ matrix.ctsem }}::$failed"
            exit 1
          fi
