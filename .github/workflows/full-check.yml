name: Full package check

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"all"'
          # check-r-package runs rcmdcheck::rcmdcheck(); nothing else installs
          # it, and without it the step dies on "there is no package called
          # 'rcmdcheck'" before R CMD check starts.
          extra-packages: any::roxygen2, any::rcmdcheck
      - name: Run R CMD check
        uses: r-lib/actions/check-r-package@v2
